name: Deploy to Hosterion (FTPS)

# Auto-deploy the site to public_html on every push to master.
# Uploads only changed files (keeps a state file on the server).
on:
  push:
    branches: [ master ]
  workflow_dispatch:        # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps          # encrypted FTP over TLS (explicit, port 21)
          port: 21
          local-dir: ./           # repo root (must end with /)
          server-dir: ./          # FTP account is rooted at public_html (must end with /)
          # Don't upload repo plumbing / dev files. (.git*, .github are covered by the
          # first two patterns; .htaccess is NOT excluded, so it deploys.)
          exclude: |
            **/.git*
            **/.git*/**
            .vscode/**
            archive/**
            README.md
            .cpanel.yml
