---
deployment:
  tasks:
    # Single command (no cross-line variable): mirror the site into the web root.
    # Includes .htaccess (dotfiles), excludes repo plumbing and dev/backup files.
    # No --delete, so it never touches cPanel folders like .well-known (SSL) / cgi-bin.
    # PRIMARY domain -> $HOME/public_html/. For an ADDON domain whose docroot is a
    # subfolder, change the target to "$HOME/public_html/aquafeed-biomar.ro/".
    - /usr/bin/rsync -av --exclude='.git' --exclude='.gitignore' --exclude='.cpanel.yml' --exclude='.vscode' --exclude='archive' --exclude='README.md' --exclude='deploy.zip' ./ "$HOME/public_html/"
